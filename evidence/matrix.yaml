    source: "README.md#earnings-call-nlp-lab"
    evidence:
      - type: test
        ref: "tests/test_tone_language.py::test_evasive_markers_are_counted"
  - id: C005
    claim: >-
      It analyzes quarter-over-quarter tone change: net tone per quarter and an
      IMPROVING / STABLE / DETERIORATING trend.
    source: "README.md#earnings-call-nlp-lab"
    evidence:
      - type: test
        ref: "tests/test_earnings_nlp.py::test_earnings_nlp_detects_deteriorating_tone"
      - type: test
        ref: "tests/test_tone_language.py::test_qoq_trend_improving_then_stable"
  - id: C006
    claim: >-
      It analyzes the management vs analyst Q&A tone split.
    source: "README.md#earnings-call-nlp-lab"
    evidence:
      - type: test
        ref: "tests/test_tone_language.py::test_role_split_separates_management_and_analyst"
  - id: C007
    claim: >-
      CHP-style verification runs before conclusions are decision-ready: the
