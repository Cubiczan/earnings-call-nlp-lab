schema_version: 1
repo: earnings-call-nlp-lab
claims:
  - id: C001
    claim: >-
      Earnings Call NLP Lab is an auditable Python app for transcript sentiment,
      management tone, and longitudinal earnings-call analysis.
    source: "README.md#earnings-call-nlp-lab"
    evidence:
      - type: test
        ref: "tests/test_earnings_nlp.py::test_earnings_nlp_detects_deteriorating_tone"
  - id: C002
    claim: >-
      It analyzes executive confidence language: per-quarter confidence term
