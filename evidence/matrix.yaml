    source: "README.md#earnings-call-nlp-lab"
    evidence:
      - type: test
        ref: "tests/test_tone_language.py::test_risk_language_is_counted"
  - id: C004
    claim: >-
      It analyzes evasiveness markers: per-quarter evasive-phrase scoring over
