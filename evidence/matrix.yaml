    source: "README.md#earnings-call-nlp-lab"
    evidence:
      - type: test
        ref: "tests/test_tone_language.py::test_confidence_language_is_counted"
  - id: C003
    claim: >-
      It analyzes risk and caution language: per-quarter risk term scoring over
