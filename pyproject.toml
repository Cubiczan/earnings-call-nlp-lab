[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-call-nlp-lab"
version = "0.1.0"
description = "Earnings call NLP lab for management tone, confidence, evasiveness, and longitudinal change."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Cubiczan" }]
dependencies = [
    "cubiczan-resilience @ git+https://github.com/icohangar-ops/cubiczan-resilience.git@09ceaf3a31fbf041fd1a6e736fa7c237218e2e8f#subdirectory=python",
]

[project.scripts]
earnings-call-nlp-lab = "earnings_call_nlp_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

