# Evidence-matrix gate — vendored per the Cubiczan standard kit
# (canonical kit: icohangar-ops/consensus-hardening-protocol @ 88067e4).
# Refuses the build while any claim in evidence/matrix.yaml is unverifiable.
# Required: a red matrix job means the README's capability claims are not
# evidence-backed. No secrets, no services, no install steps — this job runs
# before and independent of any dependency installation.
name: evidence-matrix

on:
  pull_request:
  push:
    branches: [main]

jobs:
  evidence-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 tools/verify_evidence_matrix.py
